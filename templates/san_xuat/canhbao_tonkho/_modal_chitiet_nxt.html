<!-- _modal_chitiet_nxt.html — Modal chi tiết Nhập/Xuất/Tồn
     Load baocao_nguyenlieu qua iframe embed mode.
     Khi sửa baocao_nguyenlieu → modal tự cập nhật.
-->
<style>
.nxt-overlay{position:fixed;inset:0;background:rgba(30,42,58,.4);backdrop-filter:blur(2px);z-index:900;display:none;align-items:center;justify-content:center;padding:20px;animation:nxt-fi .15s ease}
.nxt-overlay.open{display:flex}
@keyframes nxt-fi{from{opacity:0}to{opacity:1}}

.nxt-modal{background:var(--white);border-radius:14px;box-shadow:0 12px 48px rgba(0,0,0,.22);width:100%;max-width:1200px;height:85vh;display:flex;flex-direction:column;animation:nxt-su .2s ease;overflow:hidden}
@keyframes nxt-su{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

.nxt-header{padding:14px 20px 10px;border-bottom:1px solid var(--g1);display:flex;align-items:center;gap:12px;flex-shrink:0}
.nxt-header-info{flex:1;min-width:0}
.nxt-title{font-size:14px;font-weight:800;color:var(--g7);display:flex;align-items:center;gap:8px}
.nxt-title-code{font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-lt);padding:2px 8px;border-radius:5px}
.nxt-subtitle{font-size:11px;color:var(--g4);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nxt-close{width:32px;height:32px;border:none;background:var(--g0);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--g4);font-size:16px;flex-shrink:0;transition:.1s}
.nxt-close:hover{background:var(--red-lt);color:var(--red)}
.nxt-excel{height:26px;padding:0 10px;border-radius:6px;border:1.5px solid #107c41;background:var(--white);font-family:var(--sans);font-size:11px;font-weight:700;color:#107c41;cursor:pointer;display:inline-flex;align-items:center;gap:4px;flex-shrink:0;transition:.12s;vertical-align:middle}
.nxt-excel:hover{background:#f0fdf4}
.nxt-excel svg{width:13px;height:13px;stroke:#107c41;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nxt-nav{height:26px;width:26px;border-radius:6px;border:1.5px solid var(--g2);background:var(--white);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:.12s;vertical-align:middle}
.nxt-nav:hover{border-color:var(--blue);background:var(--blue-lt)}
.nxt-nav svg{width:13px;height:13px;stroke:var(--g4);fill:none;stroke-linecap:round;stroke-linejoin:round}
.nxt-nav:hover svg{stroke:var(--blue)}

.nxt-body{flex:1;min-height:0;position:relative}
.nxt-body iframe{width:100%;height:100%;border:none;display:block}
.nxt-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--white);z-index:2}
.nxt-loading .state-spin{width:24px;height:24px;border:3px solid var(--g1);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}

@media(max-width:768px){
  .nxt-modal{max-width:100%;height:90vh;border-radius:12px 12px 0 0;align-self:flex-end}
}
</style>

<div class="nxt-overlay" id="nxtOverlay" onclick="if(event.target===this)nxtClose()">
  <div class="nxt-modal">
    <div class="nxt-header">
      <div class="nxt-header-info">
        <div class="nxt-title">Chi tiết Nhập / Xuất / Tồn <span class="nxt-title-code" id="nxtMaVt"></span> <button class="nxt-excel" id="nxtExcelBtn" onclick="nxtExport()" title="Xuất Excel"><svg viewBox="0 0 16 16" stroke-width="2"><path d="M8 2v8m0 0l-3-3m3 3l3-3"/><path d="M2 11v2a1 1 0 001 1h10a1 1 0 001-1v-2"/></svg>Excel</button> <button class="nxt-nav" onclick="nxtNavigate()" title="Mở báo cáo nguyên liệu trong tab mới"><svg viewBox="0 0 16 16" stroke-width="2"><path d="M9 3h4v4"/><path d="M13 3L7 9"/><path d="M13 9v3a1 1 0 01-1 1H4a1 1 0 01-1-1V4a1 1 0 011-1h3"/></svg></button></div>
        <div class="nxt-subtitle" id="nxtTenVt"></div>
      </div>
      <button class="nxt-close" onclick="nxtClose()" title="Đóng (ESC)">✕</button>
    </div>
    <div class="nxt-body">
      <div class="nxt-loading" id="nxtLoading"><div class="state-spin"></div></div>
      <iframe id="nxtFrame" src="about:blank"></iframe>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

var _nxtMaVt='';

window.nxtOpen=function(ma_vt,ten_vt){
  _nxtMaVt=ma_vt;
  document.getElementById('nxtMaVt').textContent=ma_vt;
  document.getElementById('nxtTenVt').textContent=ten_vt||'';
  var loading=document.getElementById('nxtLoading');
  loading.style.display='flex';
  var frame=document.getElementById('nxtFrame');
  frame.onload=function(){loading.style.display='none';frame.onload=null};
  frame.src='/d/bao-cao-nguyen-lieu?embed=1&ma_vt='+encodeURIComponent(ma_vt);
  document.getElementById('nxtOverlay').classList.add('open');
  document.body.style.overflow='hidden';
};

window.nxtClose=function(){
  document.getElementById('nxtOverlay').classList.remove('open');
  document.body.style.overflow='';
  document.getElementById('nxtFrame').src='about:blank';
};

window.nxtExport=function(){
  if(!_nxtMaVt)return;
  window.open('/reports/bao-cao-nguyen-lieu/api/export-xuat?ma_vt='+encodeURIComponent(_nxtMaVt)+'&xuatle=0','_blank');
};

window.nxtNavigate=function(){
  if(!_nxtMaVt)return;
  window.open('/d/bao-cao-nguyen-lieu?ma_vt='+encodeURIComponent(_nxtMaVt),'_blank');
};

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&document.getElementById('nxtOverlay').classList.contains('open'))nxtClose();
});

})();
</script>
